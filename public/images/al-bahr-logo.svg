<svg xmlns="http://www.w3.org/2000/svg" width="320" height="72" viewBox="0 0 320 72" role="img" aria-labelledby="al-bahr-logo-title">
  <title id="al-bahr-logo-title">AL BAHR HORIZON TRAVELS AND CONSULTANTS</title>
  <defs>
    <radialGradient id="globeShade" cx="38%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1B4A7A"/>
      <stop offset="55%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#071A33"/>
    </radialGradient>
  </defs>

  <!-- Golden orbital ring (behind the globe) -->
  <ellipse cx="37" cy="36" rx="42" ry="15" fill="none" stroke="#D4A72C" stroke-width="3.5" transform="rotate(-24 37 36)"/>

  <!-- Globe -->
  <circle cx="37" cy="36" r="29" fill="url(#globeShade)"/>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1">
    <ellipse cx="37" cy="36" rx="12" ry="29"/>
    <ellipse cx="37" cy="36" rx="22" ry="29" stroke-opacity="0.18"/>
    <path d="M 9.5 27 Q 37 33 64.5 27" stroke-opacity="0.25"/>
    <path d="M 9.5 45 Q 37 39 64.5 45" stroke-opacity="0.25"/>
    <path d="M 8.5 36 L 65.5 36" stroke-opacity="0.2"/>
  </g>
  <circle cx="37" cy="36" r="29" fill="none" stroke="#0B2545" stroke-width="1.5"/>

  <!-- Flying airplane (gold) riding the orbital ring -->
  <g transform="translate(59 7) rotate(18) scale(0.88)">
    <path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z" fill="#D4A72C"/>
  </g>

  <!-- Gold divider -->
  <line x1="84" y1="14" x2="84" y2="58" stroke="#D4A72C" stroke-width="2"/>

  <!-- Wordmark -->
  <text x="94" y="34" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" letter-spacing="0.5" fill="#0B2545">AL BAHR HORIZON</text>
  <text x="95" y="56" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" font-weight="400" letter-spacing="3.4" fill="#0B2545">TRAVELS AND CONSULTANTS</text>
</svg>
